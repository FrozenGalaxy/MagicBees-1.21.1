name: Build

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Magic Bees
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clone source-built integration references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p references

          git clone --depth 1 --branch 1.21.1 \
            https://github.com/thedarkcolour/ForestryCE.git references/ForestryCE
          git clone --depth 1 --branch mc1.21.1 \
            https://github.com/sinkillerj/ProjectE.git references/ProjectE

          git clone --filter=blob:none --single-branch --branch 1.21.1-porting --no-checkout \
            https://github.com/VazkiiMods/Botania.git references/Botania
          git -C references/Botania checkout --detach dd7683264d1ac709d5d7b8c0cbfa01ea6f4a08cd

      - name: Publish Forestry to Maven Local
        working-directory: references/ForestryCE
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Publish ProjectE to Maven Local
        working-directory: references/ProjectE
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Resolve pinned addon artifacts
        run: ./gradlew dependencies --configuration clientRuntime --no-daemon

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Run data generators
        run: ./gradlew runData --no-daemon

      - name: Build finished mod JAR
        run: ./gradlew build --no-daemon

      - name: Locate finished mod JAR
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-api.jar' -print -quit)"
          test -n "$jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload finished mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: magicbees-${{ github.sha }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          compression-level: 0
