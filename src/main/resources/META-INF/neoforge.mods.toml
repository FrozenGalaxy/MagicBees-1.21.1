modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Elec332, MysteriousAges"
credits="SirSengir, Azanor, Binnie, the Forestry developers, and the maintainers of the modern compatibility targets"
description='''
A faithful modern continuation of Magic Bees: a magical bee expansion and cross-mod addon for ForestryCE.
'''

[[mixins]]
config="magicbees.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="forestry"
type="required"
versionRange="[3.0.0-alpha7,3.0.0-alpha8)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thaumaturge"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="botania"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thermal"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thermal_foundation"
type="optional"
versionRange="[11.0.7,11.1.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="thermal_expansion"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="railcraft"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
