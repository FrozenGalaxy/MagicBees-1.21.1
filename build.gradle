plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

def optionalMavenRoot = file(System.getProperty(
        'maven.repo.local', "${System.getProperty('user.home')}/.m2/repository"))
def localMavenArtifactVersion = { String artifactGroup, String artifactName ->
    def groupPath = artifactGroup.replace('.', '/')
    def artifactRoot = new File(optionalMavenRoot, "${groupPath}/${artifactName}")
    if (!artifactRoot.isDirectory()) {
        return null
    }
    def metadata = new File(artifactRoot, 'maven-metadata-local.xml')
    if (metadata.isFile()) {
        def match = metadata.text =~ /<latest>([^<]+)<\/latest>/
        if (match.find()) {
            return match.group(1)
        }
    }
    artifactRoot.listFiles().findAll { versionDirectory ->
        versionDirectory.isDirectory() && versionDirectory.listFiles().any { candidate ->
                    candidate.isFile() && candidate.name.endsWith('.jar')
                            && !candidate.name.endsWith('-sources.jar')
                            && !candidate.name.endsWith('-javadoc.jar')
        }
    }.collect { it.name }.sort().last()
}
def localMavenArtifactExists = { String artifactGroup, String artifactName ->
    localMavenArtifactVersion(artifactGroup, artifactName) != null
}
def thaumaturgeAvailable = localMavenArtifactExists(
        'com.leclowndu93150', 'thaumaturge')
def thermalAvailable = [
        'cofh_core', 'thermal_core', 'thermal_foundation', 'thermal_expansion'
].every { artifact -> localMavenArtifactExists('com.teamcofh', artifact) }

sourceSets {
    main {
        java {
            // Optional integration implementation is compiled only when its API is installed locally.
            if (!thaumaturgeAvailable) {
                exclude('eu/dsix/magicbees/integration/thaumaturge/**')
            }
        }
    }
    botaniaStubs {
        java.srcDir('src/botaniaStubs/java')
        compileClasspath = configurations.compileClasspath
    }
}
sourceSets.main.compileClasspath += sourceSets.botaniaStubs.output
tasks.named('compileJava').configure { dependsOn tasks.named('compileBotaniaStubsJava') }

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // ForestryCE and the modern Thermal stack are installed into the developer's local Maven repository.
    // Prefer their Maven POM publications over Gradle module metadata. The mod artifacts themselves are
    // consumed non-transitively below because those locally published POMs also expose development-only
    // dependencies (JEI, Ponder, ModKit, etc.) that are not Magic Bees dependencies.
	mavenLocal {
		name = 'Host Maven Local'
		content {
			includeGroup 'thedarkcolour.forestry'
			includeGroup 'com.teamcofh'
			includeGroup 'com.leclowndu93150'
			includeGroup 'org.appliedenergistics'
			includeGroup 'vazkii.botania'
			includeGroup 'moze_intel.projecte'
			includeGroup 'mods.railcraft'
			includeGroup 'com.hollingsworth.ars_nouveau'
		}
		metadataSources {
			mavenPom()
			artifact()
		}
	}

    // Actual runtime/API prerequisites used by the locally published Forestry/Thermal builds.
    maven {
        name = 'Architectury API'
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }
    maven {
        name = 'KubeJS and Rhino'
        url = 'https://maven.latvian.dev/releases'
        content { includeGroupAndSubgroups 'dev.latvian' }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'vazkii.patchouli'
            includeGroup 'mezz.jei'
            includeGroup 'vazkii.botania'
            includeGroup 'com.hollingsworth.ars_nouveau'
            includeGroup 'com.hollingsworth.nuggets'
        }
    }
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
        content { includeGroup 'com.github.glitchfiend' }
    }
    // ForestryCE/Binnie runtime dependency source. In particular KubeJS pulls
    // com.github.rtyley:animated-gif-lib-for-java from JitPack.
    maven {
        name = 'ForestryCE development dependencies'
        url = 'https://jitpack.io'
        content {
            includeGroup 'com.github.thedarkcolour'
            includeGroup 'com.github.rtyley'
        }
    }
    mavenCentral()
}

base {
    archivesName = 'magicbees-neoforge'
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Run-only compatibility/runtime mods. Keep this defined before runs so NeoGradle can wire
// individual launch configs without leaking these dependencies into runClientMinimal.
configurations {
    fullAddonRuntime
}

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.layout.projectDirectory.dir('run').dir(name)

        modSource project.sourceSets.main
    }

    client {
        runtimeClasspath configurations.localRuntime
        runtimeClasspath configurations.fullAddonRuntime
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientMinimal {
        runType 'client'
        // Lean client for checking Magic Bees against Forestry without optional addon integrations.
        configureFromTypeWithName false
        configureFromDependencies false
        runtimeClasspath configurations.runtimeClasspath
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        runtimeClasspath configurations.localRuntime
        runtimeClasspath configurations.fullAddonRuntime
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        runtimeClasspath configurations.localRuntime
        runtimeClasspath configurations.fullAddonRuntime
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        runtimeClasspath configurations.localRuntime
        runtimeClasspath configurations.fullAddonRuntime
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    testRuntimeClasspath.extendsFrom localRuntime, fullAddonRuntime
}

def projectEClientDependency = localMavenArtifactVersion('moze_intel.projecte', 'ProjectE') == projecte_version
        ? "moze_intel.projecte:ProjectE:${projecte_version}"
        : "curse.maven:projecte-226410:${projecte_file_id}"

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.3'
    // Specify the version of Minecraft/NeoForge to use.
    implementation "net.neoforged:neoforge:${neo_version}"

    // Required foundation. Forestry's local alpha7 POM currently publishes a number of dependencies that
    // are development/optional integrations of Forestry itself (JEI, Ponder and ModKit among them). Do not
    // inherit that graph into Magic Bees: this is the same non-transitive consumption pattern used by the
    // supplied Binnie development project.
    implementation("thedarkcolour.forestry:forestry-1.21.1:${forestry_version}") {
        transitive = false
    }
    fullAddonRuntime("thedarkcolour.forestry:forestrybutterflies-1.21.1:${forestry_version}") { transitive = false }

    // Forestry requires Patchouli at runtime; keep it available for every dev run,
    // including the minimal client, without making Magic Bees compile against it.
    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"
    localRuntime "mezz.jei:jei-1.21.1-neoforge:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge:${jei_version}"

    // The development client always carries every publicly resolvable supported addon. Repository order keeps
    // local publications authoritative; public Maven repositories are fallbacks.
    fullAddonRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    fullAddonRuntime "dev.latvian.mods:rhino:${rhino_version}"
    fullAddonRuntime "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    fullAddonRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    fullAddonRuntime("vazkii.botania:botania-neoforge-1.21.1:${botania_version}") { transitive = false }
    fullAddonRuntime("org.appliedenergistics:appliedenergistics2:${ae2_version}")
    fullAddonRuntime(projectEClientDependency) { transitive = false }
    fullAddonRuntime("maven.modrinth:railcraft-reborn:${railcraft_version}") { transitive = false }
    fullAddonRuntime("com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:${ars_nouveau_version}") {
        // These are already present on the shared development runtime. Excluding Ars' older declarations avoids
        // loading two versions of the same mod when the client-only configuration is added to runClient.
        exclude group: 'vazkii.patchouli'
        exclude group: 'mezz.jei'
        exclude group: 'top.theillusivec4.curios'
        exclude group: 'com.github.glitchfiend'
    }

    // Optional Thaumaturge integration. Its API and implementation source are omitted automatically when the
    // locally published artifact is unavailable, as on public CI runners.
    if (thaumaturgeAvailable) {
        compileOnly("com.leclowndu93150:thaumaturge:${thaumaturge_version}") {
            transitive = false
        }
        fullAddonRuntime("com.leclowndu93150:thaumaturge:${thaumaturge_version}") {
            transitive = false
        }
    }

	fullAddonRuntime "curse.maven:terrablender-neoforge-940057:6054947"

    // Optional Thermal compatibility. Consume each locally published CoFH/Thermal artifact
    // non-transitively as well. We explicitly provide the CoFH/Thermal module chain below, so their local
    // publication metadata cannot unexpectedly drag JEI or other development-only dependencies into tests.
    if (thermalAvailable) {
        compileOnly("com.teamcofh:cofh_core:${cofh_core_version}") { transitive = false }
        compileOnly("com.teamcofh:thermal_core:${thermal_core_version}") { transitive = false }
        compileOnly("com.teamcofh:thermal_foundation:${thermal_foundation_version}") { transitive = false }
        compileOnly("com.teamcofh:thermal_expansion:${thermal_expansion_version}") { transitive = false }

        fullAddonRuntime("com.teamcofh:cofh_core:${cofh_core_version}") { transitive = false }
        fullAddonRuntime("com.teamcofh:thermal_core:${thermal_core_version}") { transitive = false }
        fullAddonRuntime("com.teamcofh:thermal_foundation:${thermal_foundation_version}") { transitive = false }
        fullAddonRuntime("com.teamcofh:thermal_expansion:${thermal_expansion_version}") { transitive = false }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
